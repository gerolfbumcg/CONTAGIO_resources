
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONTAGIO Tools – EID Cohort Life Cycle</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap');

  :root { --bg: #d8e8f2; --text: #1a2a3a; --muted: #5a7a9a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 2.2rem 2rem 0.5rem;
  }
  header h1 {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(1.2rem, 2.8vw, 1.9rem);
    font-weight: 900;
    color: #1a2e42;
    letter-spacing: -0.01em;
  }

  #loading {
    text-align: center;
    padding: 5rem;
    font-size: 1rem;
    color: var(--muted);
    font-style: italic;
  }

  #error-msg {
    display: none;
    text-align: center;
    padding: 2rem;
    color: #c0392b;
    background: #fdf0ee;
    border: 1px solid #e8b4ae;
    border-radius: 8px;
    margin: 2rem auto;
    max-width: 600px;
    font-size: 0.88rem;
    line-height: 1.6;
  }

  .diagram-wrap {
    display: none;
    width: 100%;
    overflow: auto;
    padding: 0 1rem 1rem;
  }

  svg#diagram {
    display: block;
    margin: 0 auto;
  }

  .table-section {
    display: none;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0.5rem 2rem 3rem;
  }
  .table-section h2 {
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    color: #1a3a5c;
    margin-bottom: 0.8rem;
    padding-bottom: 0.4rem;
    border-bottom: 2px solid #aac4da;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.78rem;
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 6px rgba(0,0,0,0.07);
  }
  th {
    background: #1a3a5c;
    color: white;
    padding: 0.6rem 0.9rem;
    text-align: left;
    font-size: 0.66rem;
    letter-spacing: 0.06em;
    font-weight: 700;
    text-transform: uppercase;
  }
  td {
    padding: 0.6rem 0.9rem;
    border-bottom: 1px solid #eef0f5;
    vertical-align: top;
    line-height: 1.5;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f4f8fd; }
  td.mono { font-family: monospace; font-size: 0.68rem; color: var(--muted); }
  td.url-cell { font-family: monospace; font-size: 0.67rem; word-break: break-all; }
  td.url-cell a { color: #1a6fbf; }
  td.url-cell .empty { color: #ccd0d8; font-style: italic; }
</style>
</head>
<body>

<header>
  <h1>CONTAGIO Tools: Supporting the EID Cohort Life Cycle</h1>
</header>

<div id="loading">Loading resources…</div>
<div id="error-msg"></div>

<div class="diagram-wrap" id="diagram-wrap">
  <svg id="diagram" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<div class="table-section" id="table-section">
  <h2>Full resource table</h2>
  <table>
    <thead><tr>
      <th>res_id</th><th>res_text</th><th>res_short_descr</th>
      <th>res_long_descr</th><th>res_url</th><th>res_stage</th><th>res_wp</th>
    </tr></thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<script>
const CSV_FILE = 'contagio_resources.csv';

const STAGES = [
  { key:'explore',    label:'EXPLORE',           stageMatch:'explore',    color:'#4a8fd4', dark:'#2d6090', title:'Finding Expertise\nand Collaborators',          desc:'Initiating a consortium by identifying international research groups with the required capacities to tackle an emerging outbreak.',    icon:'explore'    },
  { key:'setup',      label:'STUDY SET-UP',       stageMatch:'set-up',     color:'#3aada0', dark:'#237a70', title:'Ethics, Legal Approvals,\nand Consent',             desc:'Securing necessary ethical and legal frameworks without the delays typically caused by lengthy legal drafting.',                         icon:'handshake'  },
  { key:'collecting', label:'COLLECTING',         stageMatch:'collect',    color:'#5bb8c4', dark:'#358a96', title:'Gathering High-Quality\nSamples and Data',          desc:'Deploying standardized tools for multimodal data collection to ensure information is harmonized across different research sites.',       icon:'chart'      },
  { key:'diagnostic', label:'DIAGNOSTIC TESTING', stageMatch:'diagnostic', color:'#5a8fb8', dark:'#3a6080', title:'Addressing Measurement\nErrors & Standardization',  desc:'Utilizing advanced biostatistical tools to ensure diagnostic data is accurate, interpretable, and generalizable across different tests.', icon:'diagnostic' },
  { key:'sharing',    label:'SHARING',            stageMatch:'shar',       color:'#2d5f8a', dark:'#1a3a5c', title:'Distributing Data,\nSamples, and Expertise',        desc:'Facilitating the flow of physical samples and digital data amongst research partners through transparent governance and access policies.', icon:'share'      },
];

// ── CSV parser ────────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split('\n');
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).filter(l => l.trim()).map(line => {
    const fields = [];
    let cur = '', inQ = false;
    for (const ch of line) {
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { fields.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    fields.push(cur.trim());
    const obj = {};
    headers.forEach((h, i) => obj[h] = (fields[i] || '').replace(/^"|"$/g, ''));
    return obj;
  });
}

// ── SVG helpers ───────────────────────────────────────────────────────────────
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const [k,v] of Object.entries(attrs)) e.setAttribute(k, String(v));
  if (parent) parent.appendChild(e);
  return e;
}
function polar(cx, cy, r, deg) {
  const a = deg * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}
function arcPath(cx, cy, r, a0, a1) {
  const [x0,y0] = polar(cx, cy, r, a0);
  const [x1,y1] = polar(cx, cy, r, a1);
  const large = ((a1 - a0 + 360) % 360) > 180 ? 1 : 0;
  return `M${x0},${y0} A${r},${r} 0 ${large} 1 ${x1},${y1}`;
}
function lighten(hex, amt) {
  const n = parseInt(hex.replace('#',''), 16);
  return `rgb(${Math.min(255,(n>>16)+amt)},${Math.min(255,((n>>8)&0xff)+amt)},${Math.min(255,(n&0xff)+amt)})`;
}

// ── Icon drawing ──────────────────────────────────────────────────────────────
function drawIcon(parent, type, cx, cy, sz, col) {
  const g = el('g', { transform:`translate(${cx-sz/2},${cy-sz/2})` }, parent);
  const s = sz, sw = s*0.11;
  const base = { stroke:col, 'stroke-width':sw, fill:'none', 'stroke-linecap':'round', 'stroke-linejoin':'round' };
  if (type === 'explore') {
    el('circle', { ...base, cx:s*.42, cy:s*.42, r:s*.26 }, g);
    el('line',   { ...base, x1:s*.62, y1:s*.62, x2:s*.82, y2:s*.82 }, g);
    el('circle', { cx:s*.28, cy:s*.76, r:s*.09, fill:col }, g);
    el('circle', { cx:s*.52, cy:s*.76, r:s*.09, fill:col }, g);
    el('path', { ...base, d:`M${s*.14},${s*.92} C${s*.14},${s*.76} ${s*.28},${s*.78} ${s*.28},${s*.86}` }, g);
    el('path', { ...base, d:`M${s*.66},${s*.92} C${s*.66},${s*.76} ${s*.52},${s*.78} ${s*.52},${s*.86}` }, g);
  } else if (type === 'handshake') {
    el('path', { ...base, d:`M${s*.08},${s*.6} L${s*.3},${s*.44} L${s*.5},${s*.5} L${s*.7},${s*.44} L${s*.92},${s*.6}` }, g);
    el('path', { ...base, d:`M${s*.3},${s*.44} L${s*.3},${s*.26} L${s*.5},${s*.18} L${s*.7},${s*.26} L${s*.7},${s*.44}` }, g);
    el('path', { ...base, d:`M${s*.26},${s*.66} L${s*.5},${s*.82} L${s*.74},${s*.66}` }, g);
  } else if (type === 'chart') {
    el('rect', { ...base, x:s*.1, y:s*.1, width:s*.8, height:s*.62, rx:s*.06 }, g);
    el('polyline', { ...base, points:`${s*.22},${s*.58} ${s*.38},${s*.34} ${s*.52},${s*.46} ${s*.66},${s*.24} ${s*.78},${s*.32}` }, g);
    el('line', { ...base, x1:s*.28, y1:s*.86, x2:s*.72, y2:s*.86 }, g);
    el('line', { ...base, x1:s*.5,  y1:s*.72, x2:s*.5,  y2:s*.86 }, g);
  } else if (type === 'diagnostic') {
    el('polyline', { ...base, points:`${s*.06},${s*.5} ${s*.24},${s*.5} ${s*.36},${s*.22} ${s*.5},${s*.78} ${s*.64},${s*.3} ${s*.76},${s*.5} ${s*.94},${s*.5}` }, g);
    el('circle', { cx:s*.32, cy:s*.84, r:s*.07, fill:col }, g);
    el('circle', { cx:s*.5,  cy:s*.84, r:s*.07, fill:col }, g);
    el('circle', { cx:s*.68, cy:s*.84, r:s*.07, fill:col }, g);
  } else if (type === 'share') {
    el('circle', { ...base, cx:s*.5,  cy:s*.22, r:s*.13 }, g);
    el('circle', { ...base, cx:s*.18, cy:s*.72, r:s*.13 }, g);
    el('circle', { ...base, cx:s*.82, cy:s*.72, r:s*.13 }, g);
    el('line', { ...base, x1:s*.38, y1:s*.3,  x2:s*.26, y2:s*.6  }, g);
    el('line', { ...base, x1:s*.62, y1:s*.3,  x2:s*.74, y2:s*.6  }, g);
    el('line', { ...base, x1:s*.32, y1:s*.72, x2:s*.68, y2:s*.72 }, g);
  }
}

// ── Text wrap helper ──────────────────────────────────────────────────────────
function wrapLines(text, maxChars) {
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur+' '+w : w;
    if (test.length > maxChars && cur) { lines.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(resources) {
  const svg = document.getElementById('diagram');

  // Geometry
  const W = 1400, H = 1400;
  const CX = W/2, CY = H/2;
  const ORBIT_R   = 270;   // centre → stage bubble centre
  const BUBBLE_R  = 100;   // stage bubble radius
  const CENTRE_R  = 110;   // central circle radius
  const CARD_W    = 190;
  const CARD_H    = 100;
  const CARD_RING = 490;   // distance from canvas centre to card centre
  const CARD_SPREAD = 200;  // tangential pixel spread between sibling cards

  // 5 stages equally spaced; top = -90°
  const angles = STAGES.map((_, i) => -90 + i * 72);

  svg.setAttribute('width',   W);
  svg.setAttribute('height',  H);
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  // ── Defs ──
  const defs = el('defs', {}, svg);

  // Shadows
  const fSh = el('filter', { id:'sh',   x:'-30%', y:'-30%', width:'160%', height:'160%' }, defs);
  el('feDropShadow', { dx:0, dy:4, stdDeviation:8,  'flood-color':'rgba(0,0,0,0.22)' }, fSh);
  const fSm = el('filter', { id:'shSm', x:'-25%', y:'-25%', width:'150%', height:'150%' }, defs);
  el('feDropShadow', { dx:0, dy:2, stdDeviation:4,  'flood-color':'rgba(0,0,0,0.13)' }, fSm);

  // Stage radial gradients
  STAGES.forEach((st, i) => {
    const g = el('radialGradient', { id:`sg${i}`, cx:'38%', cy:'32%', r:'68%' }, defs);
    el('stop', { offset:'0%',   'stop-color': lighten(st.color, 38) }, g);
    el('stop', { offset:'100%', 'stop-color': st.color              }, g);
  });

  // Centre gradient
  const cg = el('radialGradient', { id:'cg', cx:'40%', cy:'35%', r:'65%' }, defs);
  el('stop', { offset:'0%',   'stop-color':'#3a7ab0' }, cg);
  el('stop', { offset:'100%', 'stop-color':'#1a3a5c' }, cg);

  // Arrow marker
  const mk = el('marker', { id:'arr', markerWidth:7, markerHeight:7, refX:5, refY:3.5, orient:'auto' }, defs);
  el('path', { d:'M0,0.5 L0,6.5 L7,3.5 z', fill:'#8aaec8' }, mk);

  // ── Background ──
  el('rect', { width:W, height:H, fill:'#d8e8f2' }, svg);

  // Subtle orbit ring
  el('circle', { cx:CX, cy:CY, r:ORBIT_R, fill:'none',
    stroke:'rgba(255,255,255,0.30)', 'stroke-width':1.5, 'stroke-dasharray':'6,5' }, svg);

  // ── Group resources by stage ──
  const byStage = {};
  STAGES.forEach(st => byStage[st.key] = []);
  resources.forEach(r => {
    const match = STAGES.find(st => r.res_stage.toLowerCase().includes(st.stageMatch));
    if (match) byStage[match.key].push(r);
  });

  // ── Spokes (centre → bubble) ──
  STAGES.forEach((st, i) => {
    const ang = angles[i];
    const [sx0, sy0] = polar(CX, CY, CENTRE_R + 8,        ang);
    const [sx1, sy1] = polar(CX, CY, ORBIT_R - BUBBLE_R - 8, ang);
    el('line', { x1:sx0, y1:sy0, x2:sx1, y2:sy1,
      stroke:'#8aaec8', 'stroke-width':2, 'marker-end':'url(#arr)', opacity:0.8 }, svg);
  });

  // ── Cards: placed on outer ring, spread tangentially ──
  // For each stage, cards are distributed around the stage's spoke angle.
  // The tangent direction is perpendicular to the radial spoke.
  STAGES.forEach((st, i) => {
    const ang = angles[i];
    const rad = ang * Math.PI / 180;
    const [bx, by] = polar(CX, CY, ORBIT_R, ang);

    const res = byStage[st.key];
    if (!res.length) return;

    // Tangent unit vector (perpendicular to radial, rotated 90°)
    const tx = -Math.sin(rad);
    const ty =  Math.cos(rad);

    // Centre offset for this group so cards are evenly spread around spoke
    const totalSpan = (res.length - 1) * CARD_SPREAD;

    res.forEach((r, ci) => {
      // Tangential offset: spread cards symmetrically around the spoke
      const tOffset = -totalSpan / 2 + ci * CARD_SPREAD;

      // Card centre position: outward along spoke + tangential offset
      const [rcx, rcy] = polar(CX, CY, CARD_RING, ang);
      const cardCX = rcx + tx * tOffset;
      const cardCY = rcy + ty * tOffset;
      const cx0 = cardCX - CARD_W / 2;
      const cy0 = cardCY - CARD_H / 2;

      // Connector: from bubble edge to card edge nearest the bubble
      const [lx0, ly0] = polar(CX, CY, ORBIT_R + BUBBLE_R + 6, ang);
      el('line', { x1:lx0, y1:ly0, x2:cardCX, y2:cardCY,
        stroke:st.color, 'stroke-width':1.5, 'stroke-dasharray':'4,3', opacity:0.65 }, svg);

      // Card shadow + body
      el('rect', { x:cx0, y:cy0, width:CARD_W, height:CARD_H, rx:7,
        fill:'white', filter:'url(#shSm)' }, svg);
      // Colour accent bar
      el('rect', { x:cx0, y:cy0, width:4, height:CARD_H, rx:3, fill:st.color }, svg);

      // Resource name
      const nameLines = wrapLines(r.res_text, 30).slice(0, 3);
      const nameBaseY = cy0 + 14;
      if (r.res_url) {
        const a = el('a', { href:r.res_url, target:'_blank' }, svg);
        nameLines.forEach((line, li) => {
          el('text', { x:cx0+11, y:nameBaseY + li*12,
            'font-family':'Nunito,sans-serif', 'font-size':11,
            'font-weight':700, fill:st.color
          }, a).textContent = line;
        });
        el('line', { x1:cx0+11, y1:cy0+16, x2:cx0+CARD_W-8, y2:cy0+16,
          stroke:st.color, 'stroke-width':0.7, 'stroke-dasharray':'2,2', opacity:0.55 }, svg);
      } else {
        nameLines.forEach((line, li) => {
          el('text', { x:cx0+11, y:nameBaseY + li*12,
            'font-family':'Nunito,sans-serif', 'font-size':11,
            'font-weight':700, fill:'#1a2a3a'
          }, svg).textContent = line;
        });
      }

      // WP label
      el('text', { x:cx0+11, y:cy0+CARD_H-35,
        'font-family':'Nunito Sans,sans-serif', 'font-size': 11,
        'font-weight':700, 'letter-spacing':0.8, fill:st.dark, opacity:0.95
      }, svg).textContent = r.res_wp;

      const shortTrunc = wrapLines(r.res_short_descr, 35);
      shortTrunc.slice(0,2).forEach((line, li) => {
        el('text', { x:cx0+11, y:cy0+CARD_H-20+li*13,
          'font-family':'Nunito Sans,sans-serif', 'font-size':11,
          fill:'rgba(0, 0, 0, 0.81)', 'text-anchor':'left', 'font-weight':300
        }, svg).textContent = line;
      });
    });
  });

  // ── Central circle ──
  el('circle', { cx:CX, cy:CY, r:CENTRE_R+8, fill:'#1a3a5c', filter:'url(#sh)' }, svg);
  el('circle', { cx:CX, cy:CY, r:CENTRE_R,   fill:'url(#cg)' }, svg);

  // Centre text
  el('text', { x:CX, y:CY-44, 'font-family':'Nunito,sans-serif',
    'font-size':14.5, 'font-weight':900, fill:'white',
    'text-anchor':'middle', 'letter-spacing':0.4 }, svg).textContent = 'Cohorts Network';
  el('text', { x:CX, y:CY-26, 'font-family':'Nunito,sans-serif',
    'font-size':11, 'font-weight':600, fill:'rgba(255,255,255,0.78)',
    'text-anchor':'middle' }, svg).textContent = 'To be Activated Globally';
  el('text', { x:CX, y:CY-11, 'font-family':'Nunito,sans-serif',
    'font-size':11, 'font-weight':600, fill:'rgba(255,255,255,0.78)',
    'text-anchor':'middle' }, svg).textContent = 'In Outbreaks';

  el('line', { x1:CX-68, y1:CY-3, x2:CX+68, y2:CY-3,
    stroke:'rgba(255,255,255,0.28)', 'stroke-width':1 }, svg);

  const bodyLines = wrapLines(
    'A global consortium building the infrastructure to transition existing research cohorts into active outbreak response units. Work Packages are functionally connected.', 40);
  bodyLines.slice(0,7).forEach((line, li) => {
    el('text', { x:CX, y:CY+14+li*13,
      'font-family':'Nunito Sans,sans-serif', 'font-size':11,
      fill:'rgba(255,255,255,0.68)', 'text-anchor':'middle', 'font-weight':300
    }, svg).textContent = line;
  });

  // ── Stage bubbles (on top) ──
  STAGES.forEach((st, i) => {
    const ang = angles[i];
    const [bx, by] = polar(CX, CY, ORBIT_R, ang);

    // Border ring + fill
    el('circle', { cx:bx, cy:by, r:BUBBLE_R+7, fill:st.dark, filter:'url(#sh)' }, svg);
    el('circle', { cx:bx, cy:by, r:BUBBLE_R,   fill:`url(#sg${i})` }, svg);

    // Straight horizontal label above icon
    el('text', { x:bx, y:by-68,
      'font-family':'Nunito,sans-serif', 'font-size':9, 'font-weight':900,
      'letter-spacing':1.5, fill:'white', 'text-anchor':'middle', opacity:0.92
    }, svg).textContent = st.label;

    // Icon
    drawIcon(svg, st.icon, bx, by-32, 48, 'rgba(255,255,255,0.93)');

    // Title
    const titleLines = st.title.split('\n');
    titleLines.forEach((line, li) => {
      el('text', { x:bx, y:by + 14 + li*15,
        'font-family':'Nunito,sans-serif', 'font-size':11.5,
        'font-weight':800, fill:'white', 'text-anchor':'middle'
      }, svg).textContent = line;
    });

    // Description
    const descY = by + 12 + titleLines.length*15 + 7;
    wrapLines(st.desc, 18).slice(0,4).forEach((line, li) => {
      el('text', { x:bx, y:descY + li*11,
        'font-family':'Nunito Sans,sans-serif', 'font-size':10,
        fill:'rgba(255,255,255,0.80)', 'text-anchor':'middle', 'font-weight':300
      }, svg).textContent = line;
    });
  });
}

// ── Table ─────────────────────────────────────────────────────────────────────
function renderTable(resources) {
  const tbody = document.getElementById('table-body');
  resources.forEach(r => {
    const tr = document.createElement('tr');
    const urlCell = r.res_url
      ? `<a href="${r.res_url}" target="_blank" rel="noopener">${r.res_url}</a>`
      : `<span class="empty">—</span>`;
    tr.innerHTML = `
      <td class="mono">${r.res_id}</td>
      <td>${r.res_text}</td>
      <td>${r.res_short_descr}</td>
      <td style="color:#5a7a9a;font-size:0.72rem">${r.res_long_descr}</td>
      <td class="url-cell">${urlCell}</td>
      <td style="font-size:0.72rem">${r.res_stage}</td>
      <td class="mono">${r.res_wp}</td>`;
    tbody.appendChild(tr);
  });
}

// ── Boot ──────────────────────────────────────────────────────────────────────
fetch(CSV_FILE)
  .then(r => {
    if (!r.ok) throw new Error(`Could not load ${CSV_FILE} (HTTP ${r.status})`);
    return r.text();
  })
  .then(text => {
    const resources = parseCSV(text);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('diagram-wrap').style.display = 'block';
    document.getElementById('table-section').style.display = 'block';
    render(resources);
    renderTable(resources);
  })
  .catch(err => {
    document.getElementById('loading').style.display = 'none';
    const e = document.getElementById('error-msg');
    e.style.display = 'block';
    e.innerHTML = `<strong>Could not load resource data.</strong><br>${err.message}<br><br>
      Make sure <code>contagio_resources.csv</code> is in the same folder as this HTML file
      and that you are serving via a web server (not <code>file://</code>).`;
  });
</script>
</body>
</html>
