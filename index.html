<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONTAGIO Resources – EID Cohort Life Cycle</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Nunito+Sans:wght@300;400;600;700&display=swap');

  :root { --bg: #dce9f4; --text: #1a2a3a; --muted: #5a7a9a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    text-align: center;
    padding: 2rem 2rem 0.5rem;
  }
  header h1 {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(1.2rem, 2.8vw, 1.9rem);
    font-weight: 800;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  #loading {
    text-align: center;
    padding: 4rem;
    color: var(--muted);
    font-style: italic;
  }

  #error-msg {
    display: none;
    text-align: center;
    padding: 2rem;
    color: #c0392b;
    background: #fdf0ee;
    border: 1px solid #e8b4ae;
    border-radius: 8px;
    margin: 2rem;
    font-size: 0.9rem;
  }

  .diagram-wrap {
    display: none;
    width: 100%;
    overflow: auto;
    padding: 1rem;
  }

  svg#diagram {
    display: block;
    margin: 0 auto;
    overflow: visible;
  }

  .table-section {
    display: none;
    max-width: 1100px;
    margin: 0 auto;
    padding: 1rem 2rem 3rem;
  }
  .table-section h2 {
    font-family: 'Nunito', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    color: #1a3a5c;
    margin-bottom: 0.8rem;
    padding-bottom: 0.4rem;
    border-bottom: 2px solid #b0c8e0;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.78rem;
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  }
  th {
    background: #1a3a5c;
    color: white;
    padding: 0.6rem 0.9rem;
    text-align: left;
    font-size: 0.68rem;
    letter-spacing: 0.05em;
    font-weight: 700;
    text-transform: uppercase;
  }
  td {
    padding: 0.6rem 0.9rem;
    border-bottom: 1px solid #eef0f4;
    vertical-align: top;
    line-height: 1.5;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f5f9ff; }
  td.mono { font-family: monospace; font-size: 0.68rem; color: var(--muted); }
  td.url-cell { font-family: monospace; font-size: 0.68rem; word-break: break-all; }
  td.url-cell a { color: #1a6fbf; }
  .empty { color: #ccd0d8; font-style: italic; }
</style>
</head>
<body>

<header>
  <h1>CONTAGIO Tools: Supporting the EID Cohort Life Cycle</h1>
</header>

<div id="loading">Loading resources…</div>
<div id="error-msg"></div>

<div class="diagram-wrap" id="diagram-wrap">
  <svg id="diagram" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<div class="table-section" id="table-section">
  <h2>Full resource table</h2>
  <table>
    <thead>
      <tr>
        <th>res_id</th><th>res_text</th><th>res_short_descr</th>
        <th>res_long_descr</th><th>res_url</th><th>res_stage</th><th>res_wp</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
</div>

<script>
const CSV_FILE = 'contagio_resources.csv';
const SVG_NS   = 'http://www.w3.org/2000/svg';
const XHTML_NS = 'http://www.w3.org/1999/xhtml';

// Stages in clockwise order starting from top (12 o'clock = Explore)
const STAGES = [
  {
    id: 'explore',    label: 'EXPLORE',
    color: '#4a8fd4', dark: '#2d6aaa',
    title: 'Finding Expertise\nand Collaborators',
    desc: 'Initiating a consortium by identifying international research groups with the required capacities to tackle an emerging outbreak.',
    icon: 'explore',  stageKey: 'explore',
  },
  {
    id: 'setup',      label: 'STUDY SET-UP',
    color: '#3aada0', dark: '#267a70',
    title: 'Ethics, Legal Approvals,\nand Consent',
    desc: 'Securing necessary ethical and legal frameworks without the delays typically caused by lengthy legal drafting.',
    icon: 'handshake', stageKey: 'study set',
  },
  {
    id: 'collecting', label: 'COLLECTING',
    color: '#5bb8c4', dark: '#3a8f9a',
    title: 'Gathering High-Quality\nSamples and Data',
    desc: 'Deploying standardized tools for multimodal data collection to ensure information is harmonized across different research sites.',
    icon: 'chart',    stageKey: 'collect',
  },
  {
    id: 'diagnostic', label: 'DIAGNOSTIC TESTING',
    color: '#6b9dbf', dark: '#456e8a',
    title: 'Addressing Measurement\nErrors and Standardization',
    desc: 'Utilizing advanced biostatistical tools to ensure diagnostic data is accurate, interpretable, and generalizable across different tests.',
    icon: 'diagnostic', stageKey: 'diagnostic',
  },
  {
    id: 'sharing',    label: 'SHARING',
    color: '#2d5f8a', dark: '#1a3a5c',
    title: 'Distributing Data,\nSamples, and Expertise',
    desc: 'Facilitating the flow of physical samples and digital data amongst research partners through transparent governance and access policies.',
    icon: 'share',    stageKey: 'shar',
  },
];

// ── CSV ───────────────────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).map(line => {
    const fields = [];
    let cur = '', inQ = false;
    for (const ch of line) {
      if (ch === '"') inQ = !inQ;
      else if (ch === ',' && !inQ) { fields.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    fields.push(cur.trim());
    const obj = {};
    headers.forEach((h, i) => obj[h] = fields[i] || '');
    return obj;
  });
}

// ── SVG helpers ───────────────────────────────────────────────────────────────
function el(tag, attrs = {}, parent = null) {
  const e = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
}

function xel(tag, styles = {}, parent = null) {
  const e = document.createElementNS(XHTML_NS, tag);
  e.style.cssText = Object.entries(styles).map(([k,v]) => `${k}:${v}`).join(';');
  if (parent) parent.appendChild(e);
  return e;
}

function arcPath(cx, cy, r, a0, a1) {
  const r0 = a0 * Math.PI / 180, r1 = a1 * Math.PI / 180;
  return `M ${cx + r*Math.cos(r0)} ${cy + r*Math.sin(r0)} A ${r} ${r} 0 ${a1-a0 > 180 ? 1 : 0} 1 ${cx + r*Math.cos(r1)} ${cy + r*Math.sin(r1)}`;
}

function lighten(hex, n) {
  const v = parseInt(hex.slice(1), 16);
  return `rgb(${Math.min(255,(v>>16)+n)},${Math.min(255,((v>>8)&255)+n)},${Math.min(255,(v&255)+n)})`;
}

// ── Icons ─────────────────────────────────────────────────────────────────────
function drawIcon(parent, type, cx, cy, size, color) {
  const g = el('g', { transform: `translate(${cx-size/2},${cy-size/2})` }, parent);
  const s = size, c = color;
  if (type === 'explore') {
    el('circle', { cx:s*.38, cy:s*.38, r:s*.22, stroke:c, 'stroke-width':2.5, fill:'none' }, g);
    el('line',   { x1:s*.55, y1:s*.55, x2:s*.72, y2:s*.72, stroke:c, 'stroke-width':2.5, 'stroke-linecap':'round' }, g);
    el('circle', { cx:s*.33, cy:s*.73, r:s*.08, fill:c }, g);
    el('circle', { cx:s*.53, cy:s*.73, r:s*.08, fill:c }, g);
    el('path',   { d:`M${s*.17},${s*.9} Q${s*.33},${s*.8} ${s*.33},${s*.83}`, stroke:c, 'stroke-width':1.8, fill:'none' }, g);
    el('path',   { d:`M${s*.69},${s*.9} Q${s*.53},${s*.8} ${s*.53},${s*.83}`, stroke:c, 'stroke-width':1.8, fill:'none' }, g);
  } else if (type === 'handshake') {
    el('path', { d:`M${s*.08},${s*.55} L${s*.32},${s*.38} L${s*.5},${s*.44} L${s*.68},${s*.38} L${s*.92},${s*.55}`, stroke:c, 'stroke-width':2.5, fill:'none', 'stroke-linejoin':'round' }, g);
    el('path', { d:`M${s*.32},${s*.38} L${s*.32},${s*.22} L${s*.5},${s*.16} L${s*.68},${s*.22} L${s*.68},${s*.38}`, stroke:c, 'stroke-width':2.5, fill:'none', 'stroke-linejoin':'round' }, g);
    el('line', { x1:s*.28, y1:s*.62, x2:s*.5,  y2:s*.78, stroke:c, 'stroke-width':2.5, 'stroke-linecap':'round' }, g);
    el('line', { x1:s*.5,  y1:s*.78, x2:s*.72, y2:s*.62, stroke:c, 'stroke-width':2.5, 'stroke-linecap':'round' }, g);
  } else if (type === 'chart') {
    el('rect',     { x:s*.1, y:s*.1, width:s*.8, height:s*.62, rx:4, fill:'none', stroke:c, 'stroke-width':2 }, g);
    el('polyline', { points:`${s*.2},${s*.58} ${s*.36},${s*.36} ${s*.52},${s*.48} ${s*.67},${s*.26} ${s*.8},${s*.34}`, fill:'none', stroke:c, 'stroke-width':2.5, 'stroke-linejoin':'round', 'stroke-linecap':'round' }, g);
    el('line', { x1:s*.28, y1:s*.84, x2:s*.72, y2:s*.84, stroke:c, 'stroke-width':2.5, 'stroke-linecap':'round' }, g);
    el('line', { x1:s*.5,  y1:s*.72, x2:s*.5,  y2:s*.84, stroke:c, 'stroke-width':2 }, g);
  } else if (type === 'diagnostic') {
    el('polyline', { points:`${s*.08},${s*.5} ${s*.26},${s*.5} ${s*.38},${s*.24} ${s*.5},${s*.76} ${s*.62},${s*.34} ${s*.74},${s*.5} ${s*.92},${s*.5}`, fill:'none', stroke:c, 'stroke-width':2.5, 'stroke-linejoin':'round', 'stroke-linecap':'round' }, g);
    el('circle', { cx:s*.35, cy:s*.84, r:s*.06, fill:c }, g);
    el('circle', { cx:s*.5,  cy:s*.84, r:s*.06, fill:c }, g);
    el('circle', { cx:s*.65, cy:s*.84, r:s*.06, fill:c }, g);
  } else if (type === 'share') {
    el('circle', { cx:s*.5,  cy:s*.22, r:s*.11, fill:'none', stroke:c, 'stroke-width':2.5 }, g);
    el('circle', { cx:s*.18, cy:s*.72, r:s*.11, fill:'none', stroke:c, 'stroke-width':2.5 }, g);
    el('circle', { cx:s*.82, cy:s*.72, r:s*.11, fill:'none', stroke:c, 'stroke-width':2.5 }, g);
    el('line', { x1:s*.39, y1:s*.31, x2:s*.26, y2:s*.61, stroke:c, 'stroke-width':2 }, g);
    el('line', { x1:s*.61, y1:s*.31, x2:s*.74, y2:s*.61, stroke:c, 'stroke-width':2 }, g);
    el('line', { x1:s*.29, y1:s*.72, x2:s*.71, y2:s*.72, stroke:c, 'stroke-width':2 }, g);
  }
}

// ── Resource card via foreignObject ───────────────────────────────────────────
function drawCard(parent, res, x, y, w, color, dark) {
  const fo = el('foreignObject', { x, y, width: w, height: 200 }, parent);
  const wrap = document.createElementNS(XHTML_NS, 'div');
  wrap.setAttribute('xmlns', XHTML_NS);
  wrap.style.cssText = `font-family:'Nunito Sans',sans-serif;width:${w}px`;

  const card = xel('div', {
    background: 'white',
    'border-radius': '7px',
    padding: '6px 8px',
    'border-left': `3px solid ${color}`,
    'box-shadow': '0 1px 6px rgba(0,0,0,0.13)',
    'font-size': '10px',
    'line-height': '1.4',
  }, wrap);

  const wpEl = xel('div', {
    'font-size': '7px', 'font-weight': '700',
    'letter-spacing': '.08em', 'text-transform': 'uppercase',
    color: dark, opacity: '.7', 'margin-bottom': '2px',
  }, card);
  wpEl.textContent = res.res_wp;

  const nameEl = xel('div', {
    'font-size': '9.5px', 'font-weight': '700',
    'line-height': '1.35', color: '#1a2a3a', 'margin-bottom': '2px',
  }, card);
  if (res.res_url) {
    const a = document.createElementNS(XHTML_NS, 'a');
    a.setAttribute('href', res.res_url);
    a.setAttribute('target', '_blank');
    a.setAttribute('rel', 'noopener');
    a.style.cssText = `color:${color};text-decoration:none;border-bottom:1px dashed ${color}`;
    a.textContent = res.res_text;
    nameEl.appendChild(a);
  } else {
    nameEl.textContent = res.res_text;
  }

  const shortEl = xel('div', { 'font-size': '8px', color: '#5a7a9a', 'line-height': '1.3' }, card);
  shortEl.textContent = res.res_short_descr;

  fo.appendChild(wrap);
  return fo;
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render(resources) {
  const svg = document.getElementById('diagram');

  // Layout constants
  const CX = 500, CY = 500;
  const ORBIT_R  = 210;   // orbit radius (centre → bubble centre)
  const BR       = 108;   // bubble radius
  const CARD_W   = 155;
  const CARD_GAP = 12;

  // Distribute stages evenly, Explore at top
  STAGES.forEach((st, i) => {
    const deg = -90 + i * (360 / STAGES.length);
    st.deg = deg;
    st.rad = deg * Math.PI / 180;
    st.bx  = CX + ORBIT_R * Math.cos(st.rad);
    st.by  = CY + ORBIT_R * Math.sin(st.rad);
    st.resources = [];
  });

  // Assign resources to stages
  resources.forEach(r => {
    const key = r.res_stage.toLowerCase();
    const st = STAGES.find(s => key.includes(s.stageKey));
    if (st) st.resources.push(r);
  });

  // Canvas: enough room for cards radiating outward (max ~3 cards deep at 155px each)
  const SIZE = 1000;
  svg.setAttribute('width',   SIZE);
  svg.setAttribute('height',  SIZE);
  svg.setAttribute('viewBox', `0 0 ${SIZE} ${SIZE}`);

  // ── defs ──
  const defs = el('defs', {}, svg);

  STAGES.forEach((st, i) => {
    const g = el('radialGradient', { id:`grad${i}`, cx:'38%', cy:'32%', r:'68%' }, defs);
    el('stop', { offset:'0%',   'stop-color': lighten(st.color, 38) }, g);
    el('stop', { offset:'100%', 'stop-color': st.color }, g);
  });

  const filt = el('filter', { id:'shadow', x:'-25%', y:'-25%', width:'150%', height:'150%' }, defs);
  el('feDropShadow', { dx:0, dy:3, stdDeviation:7, 'flood-color':'rgba(0,0,0,0.18)' }, filt);

  const cg = el('radialGradient', { id:'centreGlow', cx:'50%', cy:'50%', r:'50%' }, defs);
  el('stop', { offset:'0%',   'stop-color':'#edf5fb' }, cg);
  el('stop', { offset:'100%', 'stop-color':'#c4daf0' }, cg);

  // Arrow marker
  const mk = el('marker', { id:'arr', markerWidth:7, markerHeight:7, refX:5, refY:3, orient:'auto' }, defs);
  el('path', { d:'M0,0 L0,6 L7,3 z', fill:'#94b4cc' }, mk);

  // ── Background ──
  el('rect', { width:SIZE, height:SIZE, fill:'#dce9f4' }, svg);

  // ── Faint orbit guide ring ──
  el('circle', { cx:CX, cy:CY, r:ORBIT_R, fill:'none', stroke:'#a8c4d8', 'stroke-width':1.5, 'stroke-dasharray':'5,5', opacity:.45 }, svg);

  // ── Spokes ──
  STAGES.forEach(st => {
    el('line', {
      x1: CX + (ORBIT_R - BR - 5) * Math.cos(st.rad),
      y1: CY + (ORBIT_R - BR - 5) * Math.sin(st.rad),
      x2: CX + (ORBIT_R + BR + 5) * Math.cos(st.rad),
      y2: CY + (ORBIT_R + BR + 5) * Math.sin(st.rad),
      stroke: st.color, 'stroke-width':1.5, opacity:.25
    }, svg);
  });

  // ── Centre circle ──
  const centreR = ORBIT_R - BR - 18;
  el('circle', { cx:CX, cy:CY, r:centreR, fill:'url(#centreGlow)', stroke:'#94b4cc', 'stroke-width':1.8 }, svg);

  // Centre text
  const cLines = [
    { t:'Cohorts Network',         s:15, w:800, f:'Nunito',      c:'#1a3a5c' },
    { t:'To be Activated',         s:12, w:600, f:'Nunito Sans', c:'#1a3a5c' },
    { t:'Globally In Outbreaks',   s:12, w:600, f:'Nunito Sans', c:'#1a3a5c' },
    { t:'',                        s:7,  w:400, f:'Nunito Sans', c:'#5a7a9a' },
    { t:'A global consortium',     s:9,  w:400, f:'Nunito Sans', c:'#5a7a9a' },
    { t:'building infrastructure', s:9,  w:400, f:'Nunito Sans', c:'#5a7a9a' },
    { t:'to activate outbreak',    s:9,  w:400, f:'Nunito Sans', c:'#5a7a9a' },
    { t:'response units.',         s:9,  w:400, f:'Nunito Sans', c:'#5a7a9a' },
  ];
  let cty = CY - 44;
  cLines.forEach(line => {
    el('text', {
      x:CX, y:cty,
      'font-family':`'${line.f}',sans-serif`,
      'font-size': line.s, 'font-weight': line.w,
      fill: line.c, 'text-anchor':'middle',
    }, svg).textContent = line.t;
    cty += line.s + 4;
  });

  // ── Stage bubbles ──
  STAGES.forEach((st, i) => {
    const { bx, by, color, dark, deg, rad } = st;

    // Outer ring + gradient fill
    el('circle', { cx:bx, cy:by, r:BR,     fill:dark,        filter:'url(#shadow)' }, svg);
    el('circle', { cx:bx, cy:by, r:BR - 5, fill:`url(#grad${i})` }, svg);

    // ── Curved label on the arc facing outward ──
    // Arc spans ±55° around the outward direction
    // For bubbles in the bottom half we reverse so text isn't upside-down
    const span = 58;
    const inBottom = by > CY + 5;
    const a0 = inBottom ? deg + span : deg - span;
    const a1 = inBottom ? deg - span : deg + span;
    const arcId = `arc${i}`;
    el('path', { id:arcId, d:arcPath(bx, by, BR - 11, a0, a1), fill:'none' }, defs);

    const lt = el('text', {
      'font-family':"'Nunito',sans-serif",
      'font-size':9, 'font-weight':800, 'letter-spacing':1.4,
      fill:'white', 'text-anchor':'middle',
    }, svg);
    el('textPath', { href:`#${arcId}`, startOffset:'50%' }, lt).textContent = st.label;

    // ── Icon ──
    drawIcon(svg, st.icon, bx, by - 20, 46, 'rgba(255,255,255,0.93)');

    // ── Title ──
    const tLines = st.title.split('\n');
    const tEl = el('text', {
      x:bx, y: by + 16,
      'font-family':"'Nunito',sans-serif",
      'font-size':12.5, 'font-weight':800,
      fill:'white', 'text-anchor':'middle',
    }, svg);
    tLines.forEach((l, li) => el('tspan', { x:bx, dy: li===0 ? 0 : 15 }, tEl).textContent = l);

    // ── Description ──
    const descY = by + 16 + tLines.length * 15 + 5;
    const dEl = el('text', {
      x:bx, y: descY,
      'font-family':"'Nunito Sans',sans-serif",
      'font-size':7.5, fill:'rgba(255,255,255,0.82)',
      'text-anchor':'middle',
    }, svg);
    const maxCh = Math.floor((BR * 1.55) / 4.2);
    let dLine = '', dLines = [];
    st.desc.split(' ').forEach(w => {
      const t = dLine ? dLine + ' ' + w : w;
      if (t.length > maxCh && dLine) { dLines.push(dLine); dLine = w; } else dLine = t;
    });
    if (dLine) dLines.push(dLine);
    dLines.slice(0, 4).forEach((l, li) => el('tspan', { x:bx, dy: li===0 ? 0 : 10 }, dEl).textContent = l);

    // ── Resource cards radiating outward ──
    if (!st.resources.length) return;

    const ux = Math.cos(rad), uy = Math.sin(rad); // outward unit vector

    // Start cards just beyond the bubble edge
    let distFromCentre = ORBIT_R + BR + CARD_GAP;

    st.resources.forEach((res) => {
      // Card top-left corner: card is CARD_W wide, centred perpendicularly on the ray
      const midX = CX + distFromCentre * ux + CARD_W / 2 * ux;
      const midY = CY + distFromCentre * uy + CARD_W / 2 * uy;

      // Rotate the card so it aligns with the ray direction
      // We place the foreignObject axis-aligned but translate+rotate the group
      const cardGroup = el('g', {
        transform: `rotate(${deg + 90}, ${CX + distFromCentre * ux}, ${CY + distFromCentre * uy})`
      }, svg);

      // Dashed connector from bubble edge to card
      el('line', {
        x1: CX + (ORBIT_R + BR) * ux,
        y1: CY + (ORBIT_R + BR) * uy,
        x2: CX + distFromCentre * ux,
        y2: CY + distFromCentre * uy,
        stroke: color, 'stroke-width':1.5,
        'stroke-dasharray':'3,3', opacity:.55
      }, svg);

      // Draw card in un-rotated group at the right position
      const cardX = CX + distFromCentre * ux - CARD_W / 2;
      const cardY = CY + distFromCentre * uy;
      drawCard(svg, res, cardX, cardY, CARD_W, color, dark);

      distFromCentre += CARD_W + 10;
    });
  });
}

// ── Table ─────────────────────────────────────────────────────────────────────
function renderTable(resources) {
  const tbody = document.getElementById('table-body');
  resources.forEach(r => {
    const tr = document.createElement('tr');
    const urlCell = r.res_url
      ? `<a href="${r.res_url}" target="_blank" rel="noopener">${r.res_url}</a>`
      : `<span class="empty">—</span>`;
    tr.innerHTML = `
      <td class="mono">${r.res_id}</td>
      <td>${r.res_text}</td>
      <td>${r.res_short_descr}</td>
      <td style="color:#5a7a9a;font-size:.72rem">${r.res_long_descr}</td>
      <td class="url-cell">${urlCell}</td>
      <td style="font-size:.72rem">${r.res_stage}</td>
      <td class="mono">${r.res_wp}</td>
    `;
    tbody.appendChild(tr);
  });
}

// ── Boot ──────────────────────────────────────────────────────────────────────
fetch(CSV_FILE)
  .then(r => {
    if (!r.ok) throw new Error(`Could not load ${CSV_FILE} (HTTP ${r.status})`);
    return r.text();
  })
  .then(text => {
    const resources = parseCSV(text);
    document.getElementById('loading').style.display = 'none';
    document.getElementById('diagram-wrap').style.display = 'block';
    document.getElementById('table-section').style.display = 'block';
    render(resources);
    renderTable(resources);
  })
  .catch(err => {
    document.getElementById('loading').style.display = 'none';
    const e = document.getElementById('error-msg');
    e.style.display = 'block';
    e.innerHTML = `<strong>Could not load resource data.</strong><br>${err.message}<br><br>
      Make sure <code>contagio_resources.csv</code> is in the same folder as this HTML file
      and that you are serving via a web server (not opening directly with <code>file://</code>).`;
  });
</script>
</body>
</html>
