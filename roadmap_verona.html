<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CONTAGIO – 5-Stage Roadmap for Rapid Epidemic Response</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800;900&family=Roboto+Condensed:wght@400;700;800&family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;1,300&display=swap');

  :root {
    --bg: #e9f0f5;
    --text: #1a2a3a;
    --muted: #5a7a9a;
    --header-bg: #1a3a5c;
    --todo: #c79100;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  .diagram-wrap {
    width: 100%;
    overflow: auto;
    padding: 1rem;
  }

  svg#diagram {
    display: block;
    margin: 0 auto;
    max-width: 100%;
    height: auto;
  }

  /* Link styling inside the SVG */
  svg a { cursor: pointer; }
  svg a text.card-title { transition: text-decoration 0.15s ease; }
  svg a:hover text.card-title { text-decoration: underline; }
  svg a:hover .card-hit { fill: rgba(26, 58, 92, 0.04); }

  .legend {
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
    padding: 0 1rem 1.5rem;
    line-height: 1.5;
  }
  .legend .swatch {
    display: inline-block;
    width: 0.7rem;
    height: 0.7rem;
    border-radius: 3px;
    vertical-align: -1px;
    margin: 0 0.3rem 0 0.6rem;
  }
  .legend .swatch.todo { background: var(--todo); }
</style>
</head>
<body>

<div class="diagram-wrap">
  <svg id="diagram" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<div class="legend">
  <span class="swatch todo"></span> = link still to be added (set it in the wording editor: <code>python3 wording_server.py</code>)
</div>

<script>
/* ============================================================================
   DATA — all texts, links and the topic order come from wording.json, which
   is edited with the wording editor (editor.html, served by wording_server.py).
   Shown text = the "new" wording when filled in, otherwise the "current" one.
   Only the visual style per stage lives here.
   ============================================================================ */

const STAGE_STYLE = {
  1: { row: 'top',    col: 0, color: '#2d5f8a', dark: '#1a3a5c', ring: '#1f3d66', ringDark: '#13294a', decorIcon: 'cohort' },
  2: { row: 'bottom', col: 1, color: '#5bb8c4', dark: '#358a96', ring: '#4c9ca2', ringDark: '#33787f', decorIcon: 'shieldCert' },
  3: { row: 'top',    col: 2, color: '#3aada0', dark: '#237a70', ring: '#4f9e97', ringDark: '#357771', decorIcon: 'tabletVial' },
  4: { row: 'bottom', col: 3, color: '#5a8fb8', dark: '#3a6080', ring: '#3e70a0', ringDark: '#29527c', decorIcon: 'cloudData' },
  5: { row: 'top',    col: 4, color: '#4a6580', dark: '#2d4560', ring: '#5b6571', ringDark: '#3d454f', decorIcon: 'funnelChart' },
};

let TITLE = '', SUBTITLE = '', STAGES = [];
let FOCUS = null;            // topic id ('T2.3') or stage id ('S2') highlighted by the editor
let ZOOM_STAGE = null;       // stage number to zoom the preview on (editor only)
let OVERFLOW = [];           // ids whose text was cut off while rendering

const pick = (n, c) => (typeof n === 'string' && n.trim()) ? n.trim() : (c || '');

function applyWording(data) {
  TITLE = data.title;
  SUBTITLE = data.subtitle;
  STAGES = data.stages.map(s => ({
    ...STAGE_STYLE[s.stage],
    number: s.stage,
    label: pick(s.new && s.new.label, s.current.label).toUpperCase(),
    sublabel: pick(s.new && s.new.sublabel, s.current.sublabel),
    items: s.topics
      .map(id => [id, data.topics[id]])
      .filter(([, t]) => t && t.show && (pick(t.new && t.new.title, t.current.title) || pick(t.new && t.new.desc, t.current.desc)))
      .map(([id, t]) => ({
        id,
        title: pick(t.new && t.new.title, t.current.title),
        desc:  pick(t.new && t.new.desc,  t.current.desc),
        icon:  t.icon || 'dot',
        url:   t.url || null,
      })),
  }));
}

/* ============================================================================
   LAYOUT — change these if you want to nudge positions
   ============================================================================ */

const LAYOUT = {
  W: 1750,
  H: 1100,
  headerH: 95,
  subtitleY: 130,
  subtitleMaxChars: 110,

  // Stage circles
  bubbleR:  150,
  topRowY:  340,        // y-centre of top-row circles
  bottomRowY: 850,      // y-centre of bottom-row circles
  colX: [180, 540, 880, 1220, 1555], // x-centre for each of the 5 columns

  // Items — vertical column, same x as the circle, opposite half of canvas
  cardW: 300,          // wider cards (was 200); left edge stays at cx - 140
  cardH: 100,          // minimum card height; real height follows the text
  cardGapY: 16,
  itemsTopY: 240, //195,       // y where items start for BOTTOM-row stages (items go above circle)
  itemsBottomY: 530,    // y where items start for TOP-row stages (items go below circle)
};

/* ============================================================================
   SVG HELPERS
   ============================================================================ */

const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) {
  const e = document.createElementNS(NS, tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined) continue;
    e.setAttribute(k, String(v));
  }
  if (parent) parent.appendChild(e);
  return e;
}

function lighten(hex, amt) {
  const n = parseInt(hex.replace('#', ''), 16);
  return `rgb(${Math.min(255, (n >> 16) + amt)},${Math.min(255, ((n >> 8) & 0xff) + amt)},${Math.min(255, (n & 0xff) + amt)})`;
}

/* Wrap by measured pixel width (canvas), so lines use the real card width. */
const _measureCtx = document.createElement('canvas').getContext('2d');
function wrapMeasured(text, font, maxW, letterSpacing = 0) {
  _measureCtx.font = font;
  const width = t => _measureCtx.measureText(t).width + letterSpacing * t.length;
  const lines = [];
  let cur = '';
  for (const w of String(text || '').split(/\s+/).filter(Boolean)) {
    const test = cur ? cur + ' ' + w : w;
    if (cur && width(test) > maxW) { lines.push(cur); cur = w; } else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

const CARD = {
  iconSize: 44, textDX: 62,              // text starts 62px right of the card's left edge
  titleFont: "800 16px Nunito, sans-serif", titleLS: 0.3, titleLH: 19, titleMax: 3,
  descFont: "400 14px 'Nunito Sans', sans-serif", descLH: 17.5, descMax: 6,
  minH: 84,
};

/* Lay out one card: wrapped lines, height and whether text had to be cut. */
function layoutItem(item, w) {
  const textW = w - CARD.textDX - 4;
  const tAll = wrapMeasured(item.title, CARD.titleFont, textW, CARD.titleLS);
  const dAll = wrapMeasured(item.desc, CARD.descFont, textW);
  const titleLines = tAll.slice(0, CARD.titleMax);
  const descLines = dAll.slice(0, CARD.descMax);
  const h = Math.max(CARD.minH,
    6 + titleLines.length * CARD.titleLH + (descLines.length ? 6 + descLines.length * CARD.descLH : 0));
  return { titleLines, descLines, h, cut: tAll.length > CARD.titleMax || dAll.length > CARD.descMax };
}

function wrapLines(text, maxChars) {
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (test.length > maxChars && cur) { lines.push(cur); cur = w; }
    else cur = test;
  }
  if (cur) lines.push(cur);
  return lines;
}

/* ============================================================================
   ICON LIBRARY — minimal flat icons matching the source infographic
   All icons are drawn inside a sz×sz box centred at (cx, cy), using `col`.
   ============================================================================ */

function drawIcon(parent, type, cx, cy, sz, col) {
  const g = el('g', { transform: `translate(${cx - sz / 2},${cy - sz / 2})` }, parent);
  const s = sz, sw = Math.max(1.4, s * 0.08);
  const base = { stroke: col, 'stroke-width': sw, fill: 'none',
                 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };

  if (type === 'clipboard') {
    el('rect', { ...base, x: s * 0.16, y: s * 0.18, width: s * 0.68, height: s * 0.74, rx: s * 0.06 }, g);
    el('rect', { ...base, x: s * 0.34, y: s * 0.08, width: s * 0.32, height: s * 0.18, rx: s * 0.04 }, g);
    el('line', { ...base, x1: s * 0.28, y1: s * 0.4,  x2: s * 0.72, y2: s * 0.4  }, g);
    el('line', { ...base, x1: s * 0.28, y1: s * 0.54, x2: s * 0.72, y2: s * 0.54 }, g);
    el('line', { ...base, x1: s * 0.28, y1: s * 0.68, x2: s * 0.6,  y2: s * 0.68 }, g);

  } else if (type === 'vial') {
    // Tube
    el('path', { ...base, d:
      `M${s * 0.36},${s * 0.1} L${s * 0.36},${s * 0.74}
       a${s * 0.14},${s * 0.14} 0 0 0 ${s * 0.28},0
       L${s * 0.64},${s * 0.1} Z` }, g);
    el('line', { ...base, x1: s * 0.3, y1: s * 0.1, x2: s * 0.7, y2: s * 0.1 }, g);
    // Liquid fill
    el('path', {
      d: `M${s * 0.36},${s * 0.5} L${s * 0.36},${s * 0.74}
          a${s * 0.14},${s * 0.14} 0 0 0 ${s * 0.28},0
          L${s * 0.64},${s * 0.5} Z`,
      fill: col, opacity: 0.35
    }, g);

  } else if (type === 'scales') {
    el('line', { ...base, x1: s * 0.5,  y1: s * 0.16, x2: s * 0.5,  y2: s * 0.88 }, g);
    el('line', { ...base, x1: s * 0.16, y1: s * 0.28, x2: s * 0.84, y2: s * 0.28 }, g);
    el('circle', { ...base, cx: s * 0.5, cy: s * 0.14, r: s * 0.04, fill: col }, g);
    // Left pan
    el('path', { ...base, d: `M${s * 0.1},${s * 0.46} L${s * 0.34},${s * 0.46} L${s * 0.22},${s * 0.62} Z` }, g);
    el('line', { ...base, x1: s * 0.22, y1: s * 0.28, x2: s * 0.22, y2: s * 0.46 }, g);
    // Right pan
    el('path', { ...base, d: `M${s * 0.66},${s * 0.46} L${s * 0.9},${s * 0.46} L${s * 0.78},${s * 0.62} Z` }, g);
    el('line', { ...base, x1: s * 0.78, y1: s * 0.28, x2: s * 0.78, y2: s * 0.46 }, g);
    // Base
    el('line', { ...base, x1: s * 0.34, y1: s * 0.88, x2: s * 0.66, y2: s * 0.88 }, g);

  } else if (type === 'network') {
    // Central globe with surrounding nodes
    el('circle', { ...base, cx: s * 0.5, cy: s * 0.5, r: s * 0.18 }, g);
    el('path', { ...base, d: `M${s * 0.32},${s * 0.5} Q${s * 0.5},${s * 0.34} ${s * 0.68},${s * 0.5}` }, g);
    el('path', { ...base, d: `M${s * 0.32},${s * 0.5} Q${s * 0.5},${s * 0.66} ${s * 0.68},${s * 0.5}` }, g);
    el('line', { ...base, x1: s * 0.5, y1: s * 0.32, x2: s * 0.5, y2: s * 0.68 }, g);
    // Surrounding nodes
    ['0.2,0.2', '0.8,0.2', '0.2,0.8', '0.8,0.8'].forEach(p => {
      const [px, py] = p.split(',').map(Number);
      el('circle', { cx: s * px, cy: s * py, r: s * 0.07, fill: col }, g);
    });
    el('line', { ...base, x1: s * 0.26, y1: s * 0.26, x2: s * 0.4,  y2: s * 0.4  }, g);
    el('line', { ...base, x1: s * 0.74, y1: s * 0.26, x2: s * 0.6,  y2: s * 0.4  }, g);
    el('line', { ...base, x1: s * 0.26, y1: s * 0.74, x2: s * 0.4,  y2: s * 0.6  }, g);
    el('line', { ...base, x1: s * 0.74, y1: s * 0.74, x2: s * 0.6,  y2: s * 0.6  }, g);

  } else if (type === 'database') {
    // 3 stacked discs
    const r = s * 0.3, h = s * 0.08;
    [0.28, 0.5, 0.72].forEach(y => {
      el('ellipse', { ...base, cx: s * 0.5, cy: s * y, rx: r, ry: h, fill: 'white' }, g);
    });
    el('line', { ...base, x1: s * 0.2, y1: s * 0.28, x2: s * 0.2, y2: s * 0.72 }, g);
    el('line', { ...base, x1: s * 0.8, y1: s * 0.28, x2: s * 0.8, y2: s * 0.72 }, g);

  } else if (type === 'people') {
    // 3 heads + shoulders cluster
    el('circle', { cx: s * 0.5,  cy: s * 0.3, r: s * 0.11, fill: col }, g);
    el('circle', { cx: s * 0.24, cy: s * 0.4, r: s * 0.09, fill: col }, g);
    el('circle', { cx: s * 0.76, cy: s * 0.4, r: s * 0.09, fill: col }, g);
    el('path', { ...base, d: `M${s * 0.32},${s * 0.78} C${s * 0.32},${s * 0.56} ${s * 0.68},${s * 0.56} ${s * 0.68},${s * 0.78}` }, g);
    el('path', { ...base, d: `M${s * 0.08},${s * 0.84} C${s * 0.08},${s * 0.62} ${s * 0.32},${s * 0.62} ${s * 0.32},${s * 0.78}` }, g);
    el('path', { ...base, d: `M${s * 0.92},${s * 0.84} C${s * 0.92},${s * 0.62} ${s * 0.68},${s * 0.62} ${s * 0.68},${s * 0.78}` }, g);

  } else if (type === 'cloud') {
    el('path', { ...base, d:
      `M${s * 0.22},${s * 0.7}
       a${s * 0.18},${s * 0.18} 0 0 1 ${s * 0.04},-${s * 0.32}
       a${s * 0.22},${s * 0.22} 0 0 1 ${s * 0.42},-${s * 0.06}
       a${s * 0.16},${s * 0.16} 0 0 1 ${s * 0.22},${s * 0.18}
       a${s * 0.14},${s * 0.14} 0 0 1 -${s * 0.04},${s * 0.28} Z` }, g);
    el('line', { ...base, x1: s * 0.36, y1: s * 0.56, x2: s * 0.62, y2: s * 0.56 }, g);
    el('line', { ...base, x1: s * 0.36, y1: s * 0.66, x2: s * 0.56, y2: s * 0.66 }, g);

  } else if (type === 'brain') {
    // Stylised brain / neural network
    el('path', { ...base, d:
      `M${s * 0.5},${s * 0.18}
       C${s * 0.28},${s * 0.18} ${s * 0.16},${s * 0.42} ${s * 0.24},${s * 0.58}
       C${s * 0.18},${s * 0.7} ${s * 0.28},${s * 0.84} ${s * 0.42},${s * 0.82}
       C${s * 0.46},${s * 0.9} ${s * 0.54},${s * 0.9} ${s * 0.58},${s * 0.82}
       C${s * 0.72},${s * 0.84} ${s * 0.82},${s * 0.7} ${s * 0.76},${s * 0.58}
       C${s * 0.84},${s * 0.42} ${s * 0.72},${s * 0.18} ${s * 0.5},${s * 0.18} Z` }, g);
    el('line', { ...base, x1: s * 0.5, y1: s * 0.18, x2: s * 0.5, y2: s * 0.86 }, g);
    el('circle', { cx: s * 0.35, cy: s * 0.4, r: s * 0.04, fill: col }, g);
    el('circle', { cx: s * 0.65, cy: s * 0.5, r: s * 0.04, fill: col }, g);
    el('circle', { cx: s * 0.4,  cy: s * 0.66, r: s * 0.04, fill: col }, g);

  } else if (type === 'share') {
    el('circle', { ...base, cx: s * 0.5,  cy: s * 0.22, r: s * 0.13, fill: 'white' }, g);
    el('circle', { ...base, cx: s * 0.18, cy: s * 0.72, r: s * 0.13, fill: 'white' }, g);
    el('circle', { ...base, cx: s * 0.82, cy: s * 0.72, r: s * 0.13, fill: 'white' }, g);
    el('line', { ...base, x1: s * 0.42, y1: s * 0.32, x2: s * 0.26, y2: s * 0.62 }, g);
    el('line', { ...base, x1: s * 0.58, y1: s * 0.32, x2: s * 0.74, y2: s * 0.62 }, g);

  } else if (type === 'dot') {
    el('circle', { cx: s * 0.5, cy: s * 0.5, r: s * 0.18, fill: col }, g);
  }  else if (type === 'link') {
    // Chain-link icon (Lucide-style hyperlink): two interlocking C-shapes
    // on a diagonal, like two chain links joined together.
    el('path', { ...base, d:
      `M${s * 0.4167},${s * 0.5417}
      a${s * 0.2083},${s * 0.2083} 0 0 0 ${s * 0.3142},${s * 0.0225}
      l${s * 0.125},${-s * 0.125}
      a${s * 0.2083},${s * 0.2083} 0 0 0 ${-s * 0.2946},${-s * 0.2946}
      l${-s * 0.0717},${s * 0.0713}` }, g);
    el('path', { ...base, d:
      `M${s * 0.5833},${s * 0.4583}
      a${s * 0.2083},${s * 0.2083} 0 0 0 ${-s * 0.3142},${-s * 0.0225}
      l${-s * 0.125},${s * 0.125}
      a${s * 0.2083},${s * 0.2083} 0 0 0 ${s * 0.2946},${s * 0.2946}
      l${s * 0.0713},${-s * 0.0713}` }, g);
  }

  return g;
}

/* ============================================================================
   STAGE ICONS — large two-tone flat icons inside the stage circles,
   modelled after slide 5 (dark navy outlines, mid/light blue fills).
   Drawn in a 100×72 design box, scaled to width `w`, centred at (cx, cy).
   ============================================================================ */

const SI = { line: '#24384f', mid: '#5f87b0', light: '#c4d6e8', white: '#ffffff' };

function drawStageIcon(parent, type, cx, cy, w) {
  // The square cohort icon is scaled up a little to match the slide's visual weight.
  const k = w / 100 * (type === 'cohort' ? 1.12 : 1);
  const g = el('g', {
    transform: `translate(${cx - 50 * k},${cy - 36 * k}) scale(${k})`,
    'stroke-linecap': 'round', 'stroke-linejoin': 'round'
  }, parent);
  const L = SI.line, M = SI.mid, Lt = SI.light, Wh = SI.white;
  const SW = 2.4;
  const o = (fill, sw = SW) => ({ fill, stroke: L, 'stroke-width': sw });
  const ln = (x1, y1, x2, y2, sw = 1.6) =>
    el('line', { x1, y1, x2, y2, stroke: L, 'stroke-width': sw }, g);
  // Closed smooth blob through points generated around (bx,by)
  const blob = (bx, by, r, radii, fill = M, sw = 1.3) => {
    const n = radii.length;
    const pts = radii.map((f, i) => {
      const a = (i / n) * Math.PI * 2;
      return [bx + Math.cos(a) * r * f, by + Math.sin(a) * r * f];
    });
    const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
    let d = `M${mid(pts[n - 1], pts[0]).join(',')}`;
    for (let i = 0; i < n; i++) {
      const p = pts[i], m = mid(p, pts[(i + 1) % n]);
      d += ` Q${p[0]},${p[1]} ${m[0]},${m[1]}`;
    }
    el('path', { d: d + ' Z', ...o(fill, sw) }, g);
  };
  const headDown = (x, y, sz = 3.6) =>
    el('path', { d: `M${x - sz},${y - sz * 1.2} L${x},${y} L${x + sz},${y - sz * 1.2} Z`,
      fill: L, stroke: L, 'stroke-width': 1 }, g);

  if (type === 'cohort') {
    // Proportions measured from slide 5: roughly square (≈ 1 : 1), centred in the box.
    // Orbit ring links 3 person badges + 3 small slate dots; 3 clockwise
    // arrows run inside the orbit around a teal grid globe.
    const slate = '#56687e', badge = '#8db5c6', globe = '#6e9db3';
    const ox = 50, oy = 38.5, OR = 27.7;
    const P = (a, r = OR) => [ox + r * Math.cos(a * Math.PI / 180), oy + r * Math.sin(a * Math.PI / 180)];

    // Orbit ring
    el('circle', { cx: ox, cy: oy, r: OR, fill: 'none', stroke: L, 'stroke-width': 1.4 }, g);
    // Small slate dots on the orbit
    [-150, -30, 90].forEach(a => {
      const [x, y] = P(a);
      el('circle', { cx: x, cy: y, r: 3.4, ...o(slate, 1.3) }, g);
    });

    // Inner clockwise arrows
    const IR = 21.5;
    [[184, 236], [303, 355], [58, 119]].forEach(([a1, a2]) => {
      const [x1, y1] = P(a1, IR), [x2, y2] = P(a2, IR);
      el('path', { d: `M${x1},${y1} A${IR},${IR} 0 0 1 ${x2},${y2}`, fill: 'none', stroke: L, 'stroke-width': 1.5 }, g);
      const t = a2 * Math.PI / 180, tx = -Math.sin(t), ty = Math.cos(t);
      const nx = Math.cos(t), ny = Math.sin(t), h = 3;
      el('path', { d: `M${x2 + tx * h},${y2 + ty * h}
        L${x2 - tx * h * 0.3 + nx * h * 0.8},${y2 - ty * h * 0.3 + ny * h * 0.8}
        L${x2 - tx * h * 0.3 - nx * h * 0.8},${y2 - ty * h * 0.3 - ny * h * 0.8} Z`,
        fill: L, stroke: L, 'stroke-width': 0.8 }, g);
    });

    // Globe with grid
    const gr = 12.2;
    el('circle', { cx: ox, cy: oy, r: gr, ...o(globe, 1.6) }, g);
    el('ellipse', { cx: ox, cy: oy, rx: gr * 0.5, ry: gr, fill: 'none', stroke: L, 'stroke-width': 1.1 }, g);
    ln(ox, oy - gr, ox, oy + gr, 1.1);
    [-0.5, 0, 0.5].forEach(f => {
      const y = oy + f * gr, hw = Math.sqrt(gr * gr - (f * gr) ** 2);
      ln(ox - hw, y, ox + hw, y, 1.1);
    });

    // Person badges (top, bottom-left, bottom-right)
    const BR = 10.8;

/* ============================================================================
   RENDER
   ============================================================================ */

function render() {
  const svg = document.getElementById('diagram');
  svg.replaceChildren();
  OVERFLOW = [];
  const { W, headerH, subtitleY, subtitleMaxChars,
          bubbleR, topRowY, bottomRowY, colX,
          cardW, cardH, cardGapY, itemsTopY, itemsBottomY } = LAYOUT;
  // Lay out all cards first (measured text), so column heights are known
  STAGES.forEach(st => {
    st._layouts = st.items.map(it => layoutItem(it, cardW));
    st._colH = st._layouts.reduce((a, l) => a + l.h, 0) + Math.max(0, st.items.length - 1) * cardGapY;
  });
  // Grow the canvas when a top-row stage has a tall column of cards below its circle
  const maxTopH = Math.max(0, ...STAGES.filter(s => s.row === 'top').map(s => s._colH));
  const H = Math.max(LAYOUT.H, itemsBottomY + maxTopH + 30);

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', W);
  svg.setAttribute('height', H);

  // ── Defs ──
  const defs = el('defs', {}, svg);

  // Drop shadow for circles
  const fSh = el('filter', { id: 'sh', x: '-30%', y: '-30%', width: '160%', height: '160%' }, defs);
  el('feDropShadow', { dx: 0, dy: 4, stdDeviation: 8, 'flood-color': 'rgba(0,0,0,0.22)' }, fSh);

  // Soft shadow for icon backgrounds
  const fSm = el('filter', { id: 'shSm', x: '-25%', y: '-25%', width: '150%', height: '150%' }, defs);
  el('feDropShadow', { dx: 0, dy: 2, stdDeviation: 3, 'flood-color': 'rgba(0,0,0,0.12)' }, fSm);

  // Ring drop shadow (offset down-left, like the slide)
  const fRing = el('filter', { id: 'shRing', x: '-30%', y: '-30%', width: '160%', height: '160%' }, defs);
  el('feDropShadow', { dx: -3, dy: 6, stdDeviation: 9, 'flood-color': 'rgba(0,0,0,0.30)' }, fRing);
  // Soft blur used for the inner-edge shadow of the white disc
  const fBlur = el('filter', { id: 'blurIn', x: '-10%', y: '-10%', width: '120%', height: '120%' }, defs);
  el('feGaussianBlur', { stdDeviation: 2.2 }, fBlur);

  // Radial "tube" gradients for each thick stage ring
  // (inner edge lighter, outer edge darker; white disc covers 0–82%)
  STAGES.forEach((st, i) => {
    const g = el('radialGradient', { id: `sg${i}`, cx: '50%', cy: '50%', r: '50%' }, defs);
    el('stop', { offset: '80%',  'stop-color': lighten(st.ring, 38) }, g);
    el('stop', { offset: '86%',  'stop-color': lighten(st.ring, 18) }, g);
    el('stop', { offset: '94%',  'stop-color': st.ring }, g);
    el('stop', { offset: '100%', 'stop-color': st.ringDark }, g);
  });

  // Subtle dotted background pattern (matches the faint geometric texture in the source)
  const pat = el('pattern', { id: 'bgdots', width: 40, height: 40, patternUnits: 'userSpaceOnUse' }, defs);
  el('circle', { cx: 1, cy: 1, r: 1, fill: 'rgba(26,58,92,0.05)' }, pat);

  // ── Background ──
  el('rect', { x: 0, y: 0, width: W, height: H, fill: '#e9f0f5' }, svg);
  el('rect', { x: 0, y: headerH, width: W, height: H - headerH, fill: 'url(#bgdots)' }, svg);

  // ── Header band ──
  el('rect', { x: 0, y: 0, width: W, height: headerH, fill: 'var(--header-bg, #1a3a5c)' }, svg);
  // Split title into a CONTAGIO accent + rest
  const headerY = headerH * 0.62;
  const titleParts = TITLE.split(':');
  const accent = titleParts[0] + ':';
  const rest = titleParts.slice(1).join(':');
  // Measure approx widths to centre nicely
  const fontFamily = 'Nunito, sans-serif';
  // Accent
  const accentText = el('text', {
    x: W / 2, y: headerY,
    'font-family': fontFamily, 'font-size': 42, 'font-weight': 900,
    fill: 'white', 'text-anchor': 'middle', 'letter-spacing': 0.5
  }, svg);
  const accentTspan = el('tspan', { fill: '#cfe2f3' }, accentText);
  accentTspan.textContent = accent + ' ';
  const restTspan = el('tspan', { fill: 'white', 'font-weight': 700 }, accentText);
  restTspan.textContent = rest.trim();

  // ── Subtitle ──
  wrapLines(SUBTITLE, subtitleMaxChars).forEach((line, li) => {
    el('text', {
      x: W / 2, y: subtitleY + li * 22,
      'font-family': fontFamily, 'font-size': 25, 'font-weight': 400,
      fill: '#2a3e54', 'text-anchor': 'middle'
    }, svg).textContent = line;
  });

  // ── Stage circles ──
  STAGES.forEach((st, i) => {
    const cx = colX[st.col];
    const cy = st.row === 'top' ? topRowY : bottomRowY;

    const ringW  = 27;                 // thick ring, ~18% of radius (slide 5)
    const innerR = bubbleR - ringW;
    const circFont = "'Roboto Condensed', 'Arial Narrow', sans-serif";
    const circText = '#1b2838';

    // Thick shaded ring with drop shadow
    el('circle', { cx, cy, r: bubbleR, fill: `url(#sg${i})`, filter: 'url(#shRing)' }, svg);
    if (FOCUS === `S${st.number}`) {
      el('circle', { cx, cy, r: bubbleR + 9, fill: 'none', stroke: '#e8a317',
        'stroke-width': 4, 'stroke-dasharray': '10,6' }, svg);
    }
    // Inner-edge shadow + white disc
    el('circle', { cx, cy, r: innerR + 0.5, fill: 'none',
      stroke: 'rgba(0,0,0,0.28)', 'stroke-width': 4, filter: 'url(#blurIn)' }, svg);
    el('circle', { cx, cy, r: innerR, fill: '#fcfdfd',
      stroke: 'rgba(0,0,0,0.10)', 'stroke-width': 1 }, svg);

    // "STAGE N:"
    el('text', {
      x: cx, y: cy - 76,
      'font-family': circFont, 'font-size': 22, 'font-weight': 700,
      fill: circText, 'text-anchor': 'middle'
    }, svg).textContent = `STAGE ${st.number}:`;

    // Stage label (bold condensed uppercase, max 2 lines)
    const allLabelLines = wrapLines(st.label, 20);
    if (allLabelLines.length > 2) OVERFLOW.push(`S${st.number}`);
    const labelLines = allLabelLines.slice(0, 2);
    const labelStartY = cy - 51;
    labelLines.forEach((line, li) => {
      el('text', {
        x: cx, y: labelStartY + li * 23,
        'font-family': circFont, 'font-size': 19.5, 'font-weight': 700,
        fill: circText, 'text-anchor': 'middle'
      }, svg).textContent = line;
    });

    // Sublabel (WP info), regular weight
    if (st.sublabel) {
      el('text', {
        x: cx, y: labelStartY + labelLines.length * 23,
        'font-family': circFont, 'font-size': 19, 'font-weight': 400,
        fill: circText, 'text-anchor': 'middle'
      }, svg).textContent = st.sublabel;
    }

    // Large two-tone stage icon in the lower half of the disc
    drawStageIcon(svg, st.decorIcon, cx, cy + 56, 130);
  });

  // ── Items ── (vertical column directly above or below the stage circle)
  STAGES.forEach((st) => {
    const cx = colX[st.col];
    const cy = st.row === 'top' ? topRowY : bottomRowY;
    const startX = cx - 140;                         // left edge as before; cards grow to the right
    let startY = st.row === 'top' ? itemsBottomY : itemsTopY;
    if (st.row === 'bottom') {
      // Cards sit above a bottom-row circle: move the column up if it is tall
      const limit = bottomRowY - bubbleR - 14;
      if (startY + st._colH > limit) {
        startY = Math.max(185, limit - st._colH);
        if (startY + st._colH > limit) st.items.forEach(it => OVERFLOW.push(`${it.id}:crowded`));
      }
    }
    let y = startY;
    st.items.forEach((item, ci) => {
      const L = st._layouts[ci];
      if (L.cut) OVERFLOW.push(item.id);
      drawItem(svg, item, startX, y, cardW, L, st);
      y += L.h + cardGapY;
    });
    const n = st.items.length;
    st._box = {
      x0: Math.min(startX - 20, cx - bubbleR - 20), x1: Math.max(startX + cardW + 20, cx + bubbleR + 20),
      y0: Math.min(n ? startY - 20 : Infinity, cy - bubbleR - 20),
      y1: Math.max(n ? startY + st._colH + 20 : -Infinity, cy + bubbleR + 20),
    };
  });
}

/* ----- One item ("card") with icon + bold title + description ------------- */

function drawItem(svg, item, x, y, w, L, stage) {
  const hasUrl = !!(item.url && item.url.trim());
  const h = L.h;

  // Linked items get a real <a>; unlinked items get a plain <g> (no fake nav).
  const a = hasUrl
    ? el('a', { href: item.url, target: '_blank', rel: 'noopener noreferrer' }, svg)
    : el('g', { 'class': 'todo' }, svg);

  // Invisible hit area (covers the whole item, fades in on hover for linked items)
  el('rect', { x: x - 6, y: y - 4, width: w + 12, height: h + 8, rx: 8,
    fill: 'transparent', 'class': 'card-hit' }, a);
  if (FOCUS && FOCUS === item.id) {
    el('rect', { x: x - 12, y: y - 10, width: w + 24, height: h + 20, rx: 12,
      fill: 'rgba(232,163,23,0.08)', stroke: '#e8a317', 'stroke-width': 3,
      'stroke-dasharray': '8,5' }, a);
  }

  // Icon
  const iconSize = CARD.iconSize;
  const iconCX = x + iconSize / 2 + 4;
  const iconCY = y + iconSize / 2 + 2;
  if (item.icon === 'dot') {
    el('circle', { cx: iconCX, cy: iconCY, r: 7, fill: stage.color }, a);
  } else {
    drawIcon(a, item.icon, iconCX, iconCY, iconSize, stage.dark);
  }

  // Badge under the icon: "OPEN LINK ↗" when there is a url, otherwise "LINK TODO"
  const badge = el('g', { 'class': 'todo-badge' }, a);
  const badgeW = 56;
  const badgeX = iconCX - badgeW / 2;
  const badgeY = iconCY + iconSize / 2 + 6;
  el('rect', hasUrl
    ? { x: badgeX, y: badgeY, width: badgeW, height: 15, rx: 7, fill: lighten(stage.color, 50), opacity: 0.6 }
    : { x: badgeX, y: badgeY, width: badgeW, height: 15, rx: 7, fill: 'rgba(199,145,0,0.12)',
        stroke: '#c79100', 'stroke-width': 0.8, 'stroke-dasharray': '3,2' }, badge);
  el('text', { x: badgeX + badgeW / 2, y: badgeY + 10.5,
    'font-family': 'Nunito Sans, sans-serif', 'font-size': 8.5, 'font-weight': 700, 'letter-spacing': 0.6,
    fill: hasUrl ? stage.dark : '#8a6700', 'text-anchor': 'middle' }, badge)
    .textContent = hasUrl ? 'OPEN LINK \u2197' : 'LINK TODO';

  // Title (bold) and description, wrapped to the measured card width
  const textX = x + CARD.textDX;
  let ty = y + 16;
  L.titleLines.forEach(line => {
    el('text', { x: textX, y: ty, 'font-family': 'Nunito, sans-serif', 'font-size': 16,
      'font-weight': 800, 'letter-spacing': CARD.titleLS,
      fill: hasUrl ? stage.dark : '#5a7a9a', 'class': 'card-title' }, a).textContent = line;
    ty += CARD.titleLH;
  });
  ty += 4;
  L.descLines.forEach(line => {
    el('text', { x: textX, y: ty, 'font-family': 'Nunito Sans, sans-serif', 'font-size': 14,
      'font-weight': 400, fill: '#33485e' }, a).textContent = line;
    ty += CARD.descLH;
  });
}

/* ----- Boot ---------------------------------------------------------------- */
// Standalone: load wording.json. Inside the editor's preview iframe, the editor
// also sends its unsaved data via postMessage, so changes show up immediately.
let gotLiveData = false;
const inEditor = window.parent !== window;
if (inEditor) {
  document.querySelector('.legend').style.display = 'none';
  document.querySelector('.diagram-wrap').style.padding = '0';
}

function renderAndReport() {
  render();
  const svg = document.getElementById('diagram');
  const zs = ZOOM_STAGE && STAGES.find(s => s.number === ZOOM_STAGE);
  if (zs && zs._box) {
    const b = zs._box;
    svg.setAttribute('viewBox', `${b.x0} ${b.y0} ${b.x1 - b.x0} ${b.y1 - b.y0}`);
    svg.setAttribute('width', b.x1 - b.x0);
    svg.setAttribute('height', b.y1 - b.y0);
  }
  if (inEditor) window.parent.postMessage({ type: 'contagio-rendered', overflow: OVERFLOW }, location.origin);
}

window.addEventListener('message', e => {
  if (e.origin !== location.origin) return;
  const m = e.data;
  if (m && m.type === 'contagio-wording') {
    gotLiveData = true;
    FOCUS = m.focus || null;
    ZOOM_STAGE = m.zoomStage || null;
    applyWording(m.data);
    renderAndReport();
  }
});

fetch('wording.json', { cache: 'no-store' })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(data => { if (!gotLiveData) { applyWording(data); renderAndReport(); } })
  .catch(() => {
    if (gotLiveData) return;
    const svg = document.getElementById('diagram');
    svg.setAttribute('viewBox', '0 0 900 120');
    el('text', { x: 450, y: 55, 'text-anchor': 'middle', 'font-family': 'Nunito Sans, sans-serif',
      'font-size': 20, fill: '#8a2a2a' }, svg).textContent =
      'Could not load wording.json. Open this page via the live site or the local server:';
    el('text', { x: 450, y: 88, 'text-anchor': 'middle', 'font-family': 'monospace',
      'font-size': 18, fill: '#1a2a3a' }, svg).textContent = 'python3 wording_server.py';
  });

if (inEditor) window.parent.postMessage({ type: 'contagio-ready' }, location.origin);

// Text is wrapped by measuring it, so render again once the web fonts have loaded
Promise.all(["800 16px Nunito", "400 14px 'Nunito Sans'", "700 20px 'Roboto Condensed'"].map(f => document.fonts.load(f)))
  .then(() => document.fonts.ready)
  .then(() => { if (STAGES.length) renderAndReport(); });
</script>

</body>
</html>
